<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif+Gujarati:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <!--
      Fallback <head> tags — what a crawler or link scraper sees before any
      JavaScript runs. Once the app mounts, src/components/Seo.jsx overwrites
      these in place with the current page's values from src/data/seo.js.

      Deliberately absent: og:url and <link rel="canonical">. Both name ONE
      specific address, and a static value here would point every page at the
      homepage for any client that doesn't run JavaScript. Seo.jsx adds them
      per page instead.
    -->
    <title>Shrutsanjivan — Reviving Ancient Jain Manuscripts</title>
    <meta
      name="description"
      content="An initiative of the Ratnatrayee Trust transcribing, researching, editing and digitizing rare Jain manuscripts, so knowledge once locked in bhandars can be read by anyone."
    />
    <meta property="og:site_name" content="Shrutsanjivan" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shrutsanjivan — Reviving Ancient Jain Manuscripts" />
    <meta
      property="og:description"
      content="An initiative of the Ratnatrayee Trust transcribing, researching, editing and digitizing rare Jain manuscripts, so knowledge once locked in bhandars can be read by anyone."
    />
    <meta property="og:image" content="/images/manuscript-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // TEMPORARY: dark mode is switched off site-wide. The saved preference is
      // left untouched in localStorage so restoring this block brings each
      // visitor's own choice back.
      //
      // To restore dark mode:
      //   1. swap the two lines below back for the commented-out original
      //   2. un-comment the <ThemeToggle /> usages in src/components/Layout.jsx
      ;(function () {
        try {
          // var t = localStorage.getItem('theme')
          // document.documentElement.classList.toggle('dark', t === 'dark')
          document.documentElement.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
